{% extends "mosaic/base.html" %}

{% block mosaic_title %}{{ master_label }}{% endblock %}

{% block mosaic_content %}
<section class="card mosaic-form-card">
  <div class="mosaic-section-head">
    <h2>{{ master_label }}</h2>
    <a class="btn-inline" href="{% url 'mosaic_master_index' %}">一覧へ戻る</a>
  </div>
  <form method="post" class="mosaic-form-grid mosaic-master-form">
    {% csrf_token %}
    {% for field in form %}
    <div class="mosaic-field">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="error-text">{{ field.errors|striptags }}</div>{% endif %}
    </div>
    {% endfor %}
    <div class="mosaic-field-wide mosaic-form-actions">
      <button type="submit">保存</button>
    </div>
  </form>
</section>
{% endblock %}
