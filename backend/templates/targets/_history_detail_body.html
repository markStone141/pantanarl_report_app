{% for department_row in row.department_rows %}
<article class="target-progress-card target-history-progress-card">
  <header class="target-progress-card__header">
    <span class="target-progress-card__eyebrow">部署</span>
    <h4>{{ department_row.label }}</h4>
  </header>
  <div class="target-progress-metrics">
    {% for metric in department_row.detail_rows %}
      {% include "includes/target_progress_metric.html" %}
    {% empty %}
      <p class="target-progress-empty">目標データがありません。</p>
    {% endfor %}
  </div>
</article>
{% endfor %}
