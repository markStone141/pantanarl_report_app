{% extends "testimony/base.html" %}

{% block testimony_title %}Testimony 管理者{% endblock %}

{% block testimony_content %}
<section class="card testimony-section">
  <h3>CSVインポート</h3>
  <p class="muted">products.csv と articles.csv を同時に取り込みます。</p>

  {% if messages %}
  <div class="testimony-import-messages">
    {% for message in messages %}
    <p class="testimony-import-message">{{ message }}</p>
    {% endfor %}
  </div>
  {% endif %}

  <form method="post" enctype="multipart/form-data" class="testimony-import-form">
    {% csrf_token %}
    <label>
      products.csv
      <input type="file" name="products_csv" accept=".csv" required>
    </label>
    <label>
      articles.csv
      <input type="file" name="articles_csv" accept=".csv" required>
    </label>
    <label>
      source
      <input type="text" name="source" value="legacy_testimony">
    </label>
    <button type="submit" class="ui-button ui-button--primary">CSVインポート実行</button>
  </form>
</section>
{% endblock %}
