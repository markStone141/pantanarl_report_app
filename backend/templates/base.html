<!DOCTYPE html>
<html lang="ja">
<head>
  {% load static %}
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Report App{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'app.css' %}?v=15" />
  <link rel="stylesheet" href="{% static 'ui_foundation.css' %}?v=1" />
  <link rel="stylesheet" href="{% static 'dashboard/mobile_drawer.css' %}?v=4" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  <script>
    (function () {
      document.querySelectorAll("form[data-auth-login-form]").forEach(function (form) {
        form.addEventListener("submit", function (event) {
          if (form.dataset.submitting === "true") {
            event.preventDefault();
            return;
          }
          form.dataset.submitting = "true";
          const button = form.querySelector('button[type="submit"]');
          const status = form.querySelector("[data-auth-submit-status]");
          if (button) {
            button.disabled = true;
            button.setAttribute("aria-disabled", "true");
            button.textContent = "ログイン中…";
          }
          if (status) status.textContent = "ログイン情報を確認しています。";
        });
      });
    })();
  </script>
</body>
</html>
